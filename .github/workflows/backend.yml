name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and development tools
        run: python -m pip install -e "./backend[dev]"
      - name: Run unit tests
        run: python -m pytest backend/tests
      - name: Check backend formatting and lint
        run: |
          python -m ruff check backend/app backend/tests
          python -m ruff format --check backend/app backend/tests
