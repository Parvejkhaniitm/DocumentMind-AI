[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-api"
version = "0.1.0"
description = "API for the DocuMind AI document intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "boto3>=1.35,<2.0",
    "celery[redis]>=5.4,<6.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0.30,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
