services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-documind-dev}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-documind-local-secret-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_EXTRAS: embeddings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://documind:${POSTGRES_PASSWORD:-documind}@db:5432/documind
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-documind-dev}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-documind-local-secret-change-me}
      CORS_ORIGINS: http://localhost,http://127.0.0.1
      HF_HOME: /home/appuser/.cache/huggingface
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - model_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_EXTRAS: embeddings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://documind:${POSTGRES_PASSWORD:-documind}@db:5432/documind
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-documind-dev}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-documind-local-secret-change-me}
      HF_HOME: /home/appuser/.cache/huggingface
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - model_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${DOCUMIND_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  model_cache:
